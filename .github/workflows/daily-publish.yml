name: 每日发布博客文章

on:
  schedule:
    # 每天北京时间 09:00（UTC 01:00）
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      date_override:
        description: '手动指定发布日期（YYYY-MM-DD，空=今天）'
        required: false
        default: ''

jobs:
  daily-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run daily publish
        env:
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: python scripts/daily_publish.py

      - name: Setup Node.js & build check
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci & build
        run: npm ci && npm run build

      - name: Commit published post
        run: |
          git config user.name "AskDrLiu Bot"
          git config user.email "bot@askdrliu.com"
          git add public/blog-posts/*.md src/data/blog-posts.ts scripts/queue.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: daily publish [skip ci]"
          git push
