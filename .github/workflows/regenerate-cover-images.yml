name: Regenerate Recent Cover Images

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Start publish date (YYYY-MM-DD)"
        required: false
        default: "2026-04-06"
      until:
        description: "End publish date (YYYY-MM-DD)"
        required: false
        default: "2026-04-26"
      saturation_threshold:
        description: "Treat images below this saturation as monochrome"
        required: false
        default: "0.19"
      lightness_threshold:
        description: "Treat images above this lightness as washed-out"
        required: false
        default: "0.82"
      max_posts:
        description: "Maximum number of covers to regenerate"
        required: false
        default: "20"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Regenerate monochrome covers
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: |
          python scripts/regenerate_recent_images.py \
            --since "${{ github.event.inputs.since || '2026-04-06' }}" \
            --until "${{ github.event.inputs.until || '2026-04-26' }}" \
            --saturation-threshold "${{ github.event.inputs.saturation_threshold || '0.19' }}" \
            --lightness-threshold "${{ github.event.inputs.lightness_threshold || '0.82' }}" \
            --max-posts "${{ github.event.inputs.max_posts || '20' }}"

      - name: Commit regenerated covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/images/blog; then
            echo "No cover image changes to commit."
            exit 0
          fi
          git add public/images/blog
          git commit -m "fix: regenerate colorful blog covers"
          git push
