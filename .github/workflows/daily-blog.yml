name: 每日医学博客自动生成

on:
  # 已由 weekly-pipeline.yml + daily-publish.yml 替代，禁用自动触发
  workflow_dispatch:
    inputs:
      debug:
        description: '调试模式（不提交）'
        required: false
        default: 'false'

concurrency:
  group: askdrliu-daily-blog
  cancel-in-progress: false

jobs:
  generate-blog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-chi-sim

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Generate blog post
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
        run: python scripts/generate_blog_auto.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm deps & build check
        run: |
          npm ci
          npm run build
        continue-on-error: false

      - name: Commit & Push
        if: ${{ github.event.inputs.debug != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/blog-posts/*.md public/images/blog/* src/data/blog-posts.ts || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "auto: daily medical blog post [skip ci]"
          git push
